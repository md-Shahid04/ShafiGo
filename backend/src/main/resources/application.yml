spring:
  application:
    name: shafigo-backend
  profiles:
    active: prod

---
# ----------------------------------------------------
# Production / MySQL Profile
# ----------------------------------------------------
spring:
  config:
    activate:
      on-profile: prod | mysql
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/swiftride_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:Tiger@123}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

---
# SwiftRide Application Custom Configurations (India - INR Currency)
swiftride:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 Hours
  matching:
    search-radius-km: 6.0
    driver-response-timeout-seconds: 25
  pricing:
    rates:
      BIKE:
        baseFare: 25.00
        pricePerKm: 9.00
        pricePerMinute: 1.50
        minimumFare: 30.00
      SEDAN:
        baseFare: 45.00
        pricePerKm: 14.00
        pricePerMinute: 2.00
        minimumFare: 60.00
      SUV:
        baseFare: 80.00
        pricePerKm: 22.00
        pricePerMinute: 3.50
        minimumFare: 100.00

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

server:
  port: 8080
