spring:
  application:
    name: shafigo-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Server Configuration
server:
  port: ${PORT:8080}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,https://shafi-go.vercel.app}

# SwiftRide Application Custom Configurations (India - INR Currency)
swiftride:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours
  matching:
    search-radius-km: ${SEARCH_RADIUS_KM:6.0}
    driver-response-timeout-seconds: 25
  pricing:
    rates:
      BIKE:
        baseFare: 25.00
        pricePerKm: 9.00
        pricePerMinute: 1.50
        minimumFare: 30.00
      SEDAN:
        baseFare: 45.00
        pricePerKm: 14.00
        pricePerMinute: 2.00
        minimumFare: 60.00
      SUV:
        baseFare: 80.00
        pricePerKm: 22.00
        pricePerMinute: 3.50
        minimumFare: 100.00

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
