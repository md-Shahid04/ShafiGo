<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <!-- ShafiGo Car Ribbon Icon with Arrow -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roof to front windshield and hood -->
    <path d="M 180 65 C 215 35, 275 35, 315 65" />
    
    <!-- Front hood & front wheel arch -->
    <path d="M 315 65 L 345 75 C 352 77, 355 83, 355 92 L 355 105 L 335 105 C 335 88, 305 88, 305 105 L 270 105" />
    
    <!-- Rear trunk & rear wheel arch -->
    <path d="M 180 65 L 155 70 C 145 72, 140 78, 140 88 L 140 105 L 160 105 C 160 88, 190 88, 190 105" />

    <!-- Dynamic Infinity Flow Line across body extending into arrow -->
    <path d="M 190 105 C 220 105, 245 80, 270 65 C 300 48, 335 48, 355 45" />
    
    <!-- Arrowhead at top right -->
    <path d="M 340 32 L 362 45 L 340 58 Z" fill="#FFFFFF" stroke="none" />
  </g>
  
  <!-- ShafiGo Wordmark -->
  <text x="250" y="152" font-family="'Inter', 'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">
    ShafiGo
  </text>
  
  <!-- Tagline -->
  <text x="250" y="178" font-family="'Inter', 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#A1A1AA" text-anchor="middle" letter-spacing="4">
    RIDE. ARRIVE. GO.
  </text>
</svg>
